<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Secure access</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --ink: #101828;
                --muted: #667085;
                --line: #e4e7ec;
                --field: #f8fafc;
                --accent: #1f4e79;
                --accent-dark: #163a5a;
                --danger: #b42318;
            }

            * { box-sizing: border-box; }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--ink);
                background: #0d1b2a;
            }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 16px;
                background:
                    radial-gradient(1100px 620px at 50% -10%, #1d3a55 0%, rgba(29, 58, 85, 0) 62%),
                    linear-gradient(180deg, #102639 0%, #0b1622 100%);
            }

            .staticrypt-page {
                width: 100%;
                max-width: 408px;
                margin: 0 auto;
            }

            .staticrypt-form {
                background: #ffffff;
                border-radius: 14px;
                padding: 40px 36px 32px;
                box-shadow: 0 1px 2px rgba(16, 24, 40, 0.18),
                    0 24px 48px -12px rgba(0, 0, 0, 0.42);
            }

            .staticrypt-mark {
                width: 46px;
                height: 46px;
                border-radius: 12px;
                background: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 22px;
            }

            .staticrypt-mark svg { width: 21px; height: 21px; display: block; }

            .staticrypt-instructions { margin: 0 0 26px; }

            .staticrypt-title {
                font-size: 22px;
                line-height: 1.25;
                font-weight: 650;
                letter-spacing: -0.015em;
                margin: 0 0 8px;
                color: var(--ink);
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 14.5px;
                line-height: 1.55;
                color: var(--muted);
            }

            .staticrypt-label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.005em;
                margin-bottom: 7px;
                color: #344054;
            }

            .staticrypt-password-container {
                position: relative;
                margin: 0 0 18px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: var(--field);
                border: 1px solid var(--line);
                border-radius: 9px;
                font-size: 15px;
                font-family: inherit;
                color: var(--ink);
                padding: 13px 46px 13px 14px;
                outline: 0;
                transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                background: #ffffff;
                border-color: var(--accent);
                box-shadow: 0 0 0 3.5px rgba(31, 78, 121, 0.14);
            }

            .staticrypt-form input::placeholder { color: #98a2b3; }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.45;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                transition: opacity 0.15s ease;
            }

            .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }

            .staticrypt-error {
                display: none;
                font-size: 13.5px;
                line-height: 1.5;
                color: var(--danger);
                background: #fef3f2;
                border: 1px solid #fecdca;
                border-radius: 8px;
                padding: 9px 12px;
                margin: -6px 0 16px;
            }

            .staticrypt-error.is-visible { display: block; }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 9px;
                margin: 0 0 22px;
                font-size: 14px;
                color: #475467;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                margin: 0;
                accent-color: var(--accent);
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                border-radius: 9px;
                background: var(--accent);
                color: #ffffff;
                font-family: inherit;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 0.01em;
                padding: 13px;
                cursor: pointer;
                outline: 0;
                transition: background 0.15s ease, transform 0.06s ease;
                -webkit-appearance: none;
                appearance: none;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover { background: var(--accent-dark); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                box-shadow: 0 0 0 3.5px rgba(31, 78, 121, 0.3);
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid var(--line);
                margin: 26px 0 16px;
            }

            .staticrypt-foot {
                margin: 0;
                font-size: 12.5px;
                line-height: 1.5;
                color: #98a2b3;
                text-align: center;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0d1b2a;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.22em solid rgba(255, 255, 255, 0.22);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (max-width: 420px) {
                .staticrypt-form { padding: 32px 22px 26px; border-radius: 12px; }
                .staticrypt-title { font-size: 20px; }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }

            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner { animation-duration: 2s; }
                .staticrypt-form .staticrypt-decrypt-button { transition: none; }
            }
        </style>
    </head>
